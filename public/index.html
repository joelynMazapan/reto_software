<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugadores</title>
    <link rel="stylesheet" href="../public/css/index.css">
</head>
<body>

    <div class="registro-container">
        <div class="registro-header">
            <h2>REGISTRO DE <span>JUGADORES</span></h2>
        </div>

        <form>
            <div class="form-group">
                <label for="inputNombre" class="required">Nombre Completo</label>
                <input type="text" id="inputNombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="inputGamertag" class="required">Gamertag</label>
                <input type="text" id="inputGamertag" required>
            </div>

            <div class="form-group">
                <label for="inputCorreo" class="required">Correo Electrónico</label>
                <input type="email" id="inputCorreo" required placeholder="correo@ejemplo.com">
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
    </div>

</body>
</html>
