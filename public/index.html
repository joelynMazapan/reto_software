<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugadores</title>
    <link rel="stylesheet" href="../public/css/index.css">
</head>
<body>

    <div class="registro-container">
        <div class="registro-header">
            <h2>REGISTRO DE <span>JUGADORES</span></h2>
        </div>

        <form id="formJugador">
            <div class="form-group">
                <label for="nombreJugador" class="required">Nombre Completo</label>
                <input type="text" id="nombreJugador" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="gamertagJugador" class="required">Gamertag</label>
                <input type="text" id="gamertagJugador" required placeholder="Ej. Shadow99">
            </div>

            <div class="form-group">
                <label for="correoJugador" class="required">Correo Electrónico</label>
                <input type="email" id="correoJugador" required placeholder="correo@ejemplo.com">
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
