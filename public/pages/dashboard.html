<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Command Center</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="registro-container command-container">
        <div class="command-header">
            <div class="command-title">
                <h2>ESTADÍSTICAS <span>GLOBALES</span></h2>
            </div>
        </div>

        <div class="bento-grid">
            <div class="bento-card main-stat">
                <div class="bento-label">Total Jugadores Registrados</div>
                <div class="bento-value" id="totalJugadores">--</div>
            </div>

            <div class="bento-card">
                <div class="bento-label">Videojuegos</div>
                <div class="bento-value" id="totalVideojuegos">--</div>
            </div>

            <div class="bento-card">
                <div class="bento-label">Puntuaciones</div>
                <div class="bento-value" id="totalPuntuaciones">--</div>
            </div>

            <div class="bento-card main-stat">
                <div class="bento-label">Puntuación Promedio Global</div>
                <div class="bento-value" id="promedioPuntuacion">--</div>
            </div>
            
        </div>
        <div class="command-footer">
            <a href="login.html" class="btn-cyber-outline">Cerrar Sesión</a>
        </div>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
