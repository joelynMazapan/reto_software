<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Command Center</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <nav class="cyber-navbar">
        <a href="dashboard.html" class="navbar-brand">Torneo<span>X</span></a>
        
        <ul class="navbar-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="registros.html">Registros</a></li>
            <li><a href="ranking.html">Clasificación</a></li>
        </ul>

        <div class="navbar-search">
            <input type="text" id="inputBuscarJugador" placeholder="Buscar jugador..." autocomplete="off">
            <div id="searchResultsDropdown" class="search-dropdown" style="display: none;"></div>
        </div>

        <button id="btnCerrarSesion" class="btn-logout">Salir</button>
    </nav>

    <div class="registro-container command-container">
        <div class="command-header">
            <div class="command-title">
                <h2>ESTADÍSTICAS <span>GLOBALES</span></h2>
            </div>
        </div>

        <div class="bento-grid">
            <div class="bento-card main-stat">
                <div class="bento-label">Total Jugadores Registrados</div>
                <div class="bento-value" id="totalJugadores">--</div>
            </div>

            <div class="bento-card">
                <div class="bento-label">Videojuegos</div>
                <div class="bento-value" id="totalVideojuegos">--</div>
            </div>

            <div class="bento-card">
                <div class="bento-label">Puntuaciones</div>
                <div class="bento-value" id="totalPuntuaciones">--</div>
            </div>

            <div class="bento-card main-stat">
                <div class="bento-label">Puntuación Promedio Global</div>
                <div class="bento-value" id="promedioPuntuacion">--</div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
