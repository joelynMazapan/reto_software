<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros - Sistema de Torneos</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/registros.css">
</head>
<body>

    <!-- Navbar integrado directamente -->
    <nav class="cyber-navbar">
        <a href="dashboard.html" class="navbar-brand">Torneo<span>X</span></a>
        
        <ul class="navbar-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="registros.html" class="active">Registros</a></li>
            <li><a href="ranking.html">Clasificación</a></li>
        </ul>

        <div class="navbar-search">
            <input type="text" id="inputBuscarJugador" placeholder="Buscar jugador...">
        </div>

        <button id="btnCerrarSesion" class="btn-logout">Salir</button>
    </nav>

    <div class="registro-container registros-container">
        <div class="registros-header">
            <h2>PANEL DE <span>REGISTROS</span></h2>
            <p>Dar de alta nuevos videojuegos y registrar puntuaciones en el sistema</p>
        </div>

        <div class="forms-grid">
            
            <div class="form-card">
                <div>
                    <h3 style="margin-bottom: 15px;">Nuevo Videojuego</h3>
                    <form id="formVideojuego">
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label for="nombreVideojuego">Nombre del Videojuego</label>
                            <input type="text" id="nombreVideojuego" name="nombre" placeholder="Ej. Cyberpunk Arena" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label for="generoVideojuego">Género</label>
                            <input type="text" id="generoVideojuego" name="genero" placeholder="Ej. Shooter / Acción" required>
                        </div>

                        <div id="mensajeVideojuego" class="form-message" style="display: none;"></div>
                    </form>
                </div>
                <button type="submit" form="formVideojuego" class="btn-cyber">Registrar Videojuego</button>
            </div>

            <div class="form-card">
                <div>
                    <h3 style="margin-bottom: 15px;">Nueva Puntuación</h3>
                    <form id="formPuntuacion">
                        <div class="selects-row-grid" style="margin-bottom: 10px;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="selectJugador">Jugador</label>
                                <select id="selectJugador" name="jugador_id" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                </select>
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="selectVideojuego">Videojuego</label>
                                <select id="selectVideojuego" name="videojuego_id" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 10px;">
                            <label for="valorPuntuacion">Puntuación</label>
                            <input type="number" id="valorPuntuacion" name="puntuacion" placeholder="Ej. 9500" required>
                        </div>

                        <div id="mensajePuntuacion" class="form-message" style="display: none;"></div>
                    </form>
                </div>
                <button type="submit" form="formPuntuacion" class="btn-cyber">Guardar Puntuación</button>
            </div>

        </div>
    </div>

    <!-- Script para el botón de cerrar sesión del navbar -->
    <script>
        document.getElementById("btnCerrarSesion").addEventListener("click", () => {
            window.location.href = "../index.html";
        });
    </script>
    <script src="../js/registros.js"></script>
</body>
</html>
