<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Jugadores</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>

    <div class="registro-container">
        <div class="registro-header">
            <h2>INICIAR <span>SESIÓN</span></h2>
        </div>

        <form>
            <div class="form-group">
                <label for="inputGamertag" class="required">Gamertag o Correo</label>
                <input type="text" id="inputGamertag">
            </div>

            <div class="form-group">
                <label for="inputPassword" class="required">Contraseña</label>
                <input type="password" id="inputPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </div>

</body>
</html>
