<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugadores - TorneoX</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/registros.css">
    <link rel="stylesheet" href="../css/jugadores.css">
    
</head>
<body>

    <nav class="cyber-navbar">
        <a href="../index.html" class="navbar-brand">Torneo<span>X</span></a>
        
        <ul class="navbar-links">
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="jugadores.html" class="active">Jugadores</a></li>
            <li><a href="registros.html">Videojuegos</a></li>
            <li><a href="ranking.html">Clasificación</a></li>
        </ul>

        <div class="navbar-search">
            <input type="text" id="inputBuscarJugador" placeholder="Buscar jugador..." autocomplete="off">
            <div id="searchResultsDropdown" class="search-dropdown" style="display: none;"></div>
        </div>
    </nav>

    <div class="registro-container">
        <div class="registro-header">
            <h2>REGISTRO DE <span>JUGADORES</span></h2>
        </div>

        <form id="formJugador">
            <div class="form-group">
                <label for="nombreJugador" class="required">Nombre Completo</label>
                <input type="text" id="nombreJugador" required>
            </div>

            <div class="form-group">
                <label for="gamertagJugador" class="required">Gamertag / Alias</label>
                <input type="text" id="gamertagJugador">
            </div>

            <div class="form-group">
                <label for="correoJugador" class="required">Correo Electrónico</label>
                <input type="email" id="correoJugador">
            </div>

            <button type="submit" class="btn-submit">Registrar Competidor</button>
        </form>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/jugadores.js"></script>
</body>
</html>
