<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación - Sistema de Torneos</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/ranking.css">
</head>
<body>

    <nav class="cyber-navbar">
        <a href="dashboard.html" class="navbar-brand">Torneo<span>X</span></a>
        
        <ul class="navbar-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="registros.html">Registros</a></li>
            <li><a href="ranking.html" class="active">Clasificación</a></li>
        </ul>

        <div class="navbar-search">
            <input type="text" id="inputBuscarJugador" placeholder="Buscar jugador..." autocomplete="off">
            <div id="searchResultsDropdown" class="search-dropdown" style="display: none;"></div>
        </div>

        <button id="btnCerrarSesion" class="btn-logout">Salir</button>
    </nav>

    <div class="registro-container ranking-container">
        <div class="ranking-header">
            <div class="ranking-title">
                <h2>TABLA DE <span>CLASIFICACIÓN</span></h2>
                <p>Ranking de los mejores jugadores y puntuaciones</p>
            </div>
        </div>
        <div class="leaderboard-card">
            <table class="cyber-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Rank</th>
                        <th>Jugador</th>
                        <th>Videojuego</th>
                        <th style="text-align: right;">Puntuación</th>
                    </tr>
                </thead>
                <tbody id="rankingTableBody">
                    <tr>
                        <td colspan="4" class="empty-state">Cargando clasificación desde el servidor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/ranking.js"></script>
</body>
</html>
